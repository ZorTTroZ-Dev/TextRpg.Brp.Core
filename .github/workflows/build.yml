name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore TextRpg.Brp.Core.slnx
      - run: dotnet build TextRpg.Brp.Core.slnx --no-restore --configuration Release
      - run: dotnet test TextRpg.Brp.Core.slnx --no-build --configuration Release
